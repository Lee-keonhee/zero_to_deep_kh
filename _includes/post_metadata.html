<div class="post-metadata">
  {% if page.category %}
    <div class="post-category mb-2">
      <i class="fas fa-folder"></i>
      <a href="{{ site.baseurl }}/category/{{ page.category | slugify }}/" class="badge badge-primary">
        {{ page.category }}
      </a>
    </div>
  {% endif %}

  {% if page.tags %}
    <div class="post-tags">
      <i class="fas fa-tags"></i>
      {% for tag in page.tags %}
        <a href="{{ site.baseurl }}/tag/{{ tag | slugify }}/" class="badge badge-secondary">
          #{{ tag }}
        </a>
      {% endfor %}
    </div>
  {% endif %}
</div>
